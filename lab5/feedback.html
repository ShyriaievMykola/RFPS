<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Форма зворотного зв'язку інтернет-магазину «Полотно»: співпраця, пропозиції, скарги та повідомлення про помилки.">
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Зворотний зв'язок — Полотно</title>
    <script src="js/feedback.js" defer></script>

    <style>
        .feedback-form {
            display: flex;
            flex-flow: row wrap;
            justify-content: space-between;
            align-items: flex-start;
            align-content: flex-start;
            gap: 1.125rem;
            max-width: 56.25rem;
            padding: 1.25rem;
            background-color: #ffffff;
            border: 1px solid #ddd8cc;
        }

        .personal-info {
            order: 1;
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 21.25rem;
            display: flex;
            flex-flow: column nowrap;
            gap: 0.375rem;
            padding: 0.875rem 1rem;
            border: 1px solid hsl(162, 20%, 70%);
        }

        .field-purpose {
            order: 2;
            flex: 1 1 20rem;
        }

        .field-details {
            order: 3;
            flex: 2 1 100%;
        }

        .field-consent {
            order: 4;
            flex: 1 1 60%;
            align-self: center;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .field-buttons {
            order: 5;
            flex: 0 1 auto;
            align-self: flex-end;
            display: flex;
            gap: 0.625rem;
        }

        .personal-info .field { margin: 0; }

        legend {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;
            padding: 0 0.375rem;
            color: hsl(162, 33%, 22%);
        }

        label { display: block; margin-bottom: 0.125rem; font-size: 0.9rem; }
        .field-consent label { margin: 0; }

        input[type="text"], input[type="email"], select, textarea { width: 100%; }
        input[type="number"] { width: 7.5rem; }
        textarea { resize: vertical; min-height: 7.5rem; }

        .feedback-form input:required,
        .feedback-form select:required {
            border-left: 3px solid hsl(162, 33%, 45%);
        }

        .content {
            display: flex;
            flex-flow: column nowrap;
            gap: 0.875rem;
        }

        .details-wrap {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .details-wrap textarea {
            flex: 1 1 auto;
            width: auto;
            min-width: 0;
            -webkit-transition: background-color 0.3s, border-color 0.3s, -webkit-box-shadow 0.3s;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .details-wrap textarea.details-active {
            background-color: hsl(162, 33%, 95%);
            border: 2px solid hsl(162, 33%, 35%);
            -webkit-box-shadow: 0 6px 16px rgba(47, 93, 80, 0.35);
            -moz-box-shadow: 0 6px 16px rgba(47, 93, 80, 0.35);
            box-shadow: 0 6px 16px rgba(47, 93, 80, 0.35);
        }

        .details-tip {
            position: relative;
            flex: 0 0 15rem;
            padding: 0.625rem 0.75rem;
            border-radius: 4px;
            background-color: hsl(162, 33%, 27%);
            color: #ffffff;
            font-size: 0.85rem;
            opacity: 0;
            visibility: hidden;
            -webkit-transition: opacity 0.3s, visibility 0.3s;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .details-tip::before {
            content: "";
            position: absolute;
            top: 14px;
            left: -8px;
            border-width: 8px 8px 8px 0;
            border-style: solid;
            border-color: transparent hsl(162, 33%, 27%) transparent transparent;
        }

        .details-tip-visible {
            opacity: 1;
            visibility: visible;
        }

        @media only screen and (max-width: 768px) {
            .details-wrap { -ms-flex-direction: column; flex-direction: column; -ms-flex-align: stretch; align-items: stretch; }
            .details-wrap textarea { width: 100%; }
            .details-tip { flex-basis: auto; }
            .details-tip::before { display: none; }
            .field-buttons { align-self: stretch; }
        }

        @media only screen and (max-width: 600px) {
            .feedback-form { padding: 0.75rem; }
            .personal-info, .field-purpose, .field-consent { flex-basis: 100%; }
            .field-buttons button { -webkit-box-flex: 1; -ms-flex: 1 1 0; flex: 1 1 0; }
        }
    </style>
</head>
<body>
    <header class="site-header" id="top">
        <div class="brand">
            <img class="brand-logo" src="images/logo.svg" alt="Логотип магазину Полотно" width="60" height="60">
            <h1>Зворотний зв'язок</h1>
        </div>
        <form class="home-form" action="index.html" method="get">
            <button type="submit">&larr; На головну сторінку</button>
        </form>
    </header>
    <main class="content">
        <h2>Залиште ваше повідомлення</h2>
        <form class="feedback-form" action="#" method="post">
            <fieldset class="personal-info">
                <legend>Персональна інформація</legend>
                <p class="field field-fullname">
                    <label for="fullname">Прізвище та ім'я:*</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="Шевченко Тарас" required>
                </p>
                <p class="field field-email">
                    <label for="email">E-mail:*</label><br>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </p>
                <p class="field field-age">
                    <label for="age">Вік:</label><br>
                    <input type="number" id="age" name="age" min="14" max="100" placeholder="20">
                </p>
                <p class="field field-education">
                    <label for="education">Освіта:</label><br>
                    <select id="education" name="education">
                        <option value="full">Повна</option>
                        <option value="incomplete">Неповна</option>
                        <option value="higher">Вища</option>
                        <option value="professional">Професійна</option>
                    </select>
                </p>
            </fieldset>
            <p class="field field-purpose">
                <label for="purpose">Мета зворотного зв'язку:*</label><br>
                <select id="purpose" name="purpose" required>
                    <option value="" disabled selected>-- Оберіть мету --</option>
                    <option value="cooperation">Співпраця</option>
                    <option value="complaint">Скарга на порушення права власності</option>
                    <option value="proposal">Пропозиція</option>
                    <option value="bug">Наявність помилки</option>
                </select>
            </p>
            <p class="field field-details">
                <label for="details">Детально (макс. 300 символів):</label><br>
                <span class="details-wrap">
                    <textarea id="details" name="details" rows="6" cols="50" maxlength="300" placeholder="Опишіть ваше питання..."></textarea>
                </span>
            </p>
            <p class="field field-consent">
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Я даю згоду на обробку моїх персональних даних</label>
            </p>
            <p class="field field-buttons">
                <button type="submit">Надіслати</button>
                <button type="reset">Очистити форму</button>
            </p>
        </form>
    </main>
    <footer class="site-footer">
        <p>Email: info@polotno.example</p>
        <p>&copy; 2026 Полотно. Усі права захищено.</p>
    </footer>
</body>
</html>
